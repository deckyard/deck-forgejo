# Grimoire book configuration for the @deckyard/forgejo documentation.

[book]
title = "@deckyard/forgejo"
description = "A client for the Forgejo REST API: repositories, issues, pull requests, releases with assets, branches, tags and files"
language = "en"
src = "docs"

[build]
out = "site"
clean = true
jobs = 0

[html]
theme = "nordic"
mode = "auto"
navPosition = "left"
tocPosition = "right"
tocDepth = 3
sectionNumbers = true
titleUrl = "https://deckyard.github.io/deck-forgejo/"
repoUrl = "https://github.com/deckyard/deck-forgejo"
repoLabel = "Source"
editUrl = "https://github.com/deckyard/deck-forgejo/edit/main/docs/{path}"

[highlight]
enabled = true

[search]
enabled = true

[pdf]
enabled = false
